<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silly Cat</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #87CEEB, #bdefff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        max-width: 400px;
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 15px;
    }

    .cat {
        font-size: 6rem;
        animation: bounce 1s infinite alternate;
    }

    p {
        margin: 20px 0;
        color: #555;
    }

    button {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        background: #ff9800;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #f57c00;
        transform: scale(1.05);
    }

    @keyframes bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-15px); }
    }
</style>
</head>
<body>

<div class="card">
    <div class="cat" id="cat">🐱</div>
    <h1>Silly Cat Site</h1>
    <p>If you can see this cat, your deployment works! 🎉</p>
    <button onclick="meow()">Pet the Cat</button>
</div>

<script>
function meow() {
    const cat = document.getElementById("cat");
    cat.textContent = "😸";
    alert("Meow! Your deployment is working.");
    setTimeout(() => {
        cat.textContent = "🐱";
    }, 800);
}
</script>

</body>
</html>
